<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>zenoh-nostd</title>
        <style>
            body { font-family: sans-serif; margin: 2em; }
            #ping { font-size: 4em; margin: 0.3em 0; }
            #status { color: #666; margin-left: 1em; font-size: 0.25em; }
            #log { background: #eee; height: 20em; overflow-y: auto; padding: 0.5em; }
        </style>
    </head>
    <body>
        <h1>zenoh-nostd test</h1>
        <p>
            Listens on Web Serial at 115200 baud for a zenoh client, shows
            <code>potato/ping</code> and puts on <code>potato/set_base_ping</code>.
        </p>
        <button id="serial">Pick serial port</button>
        <div><span id="ping">-</span><span id="status">no serial port</span></div>
        <input id="base" type="number" value="100" />
        <button id="set">Set base ping</button>
        <pre id="log"></pre>
        <script type="module">
            import init, { set_serial_port, set_base_ping } from "./z_example.js";

            const log = document.getElementById("log");
            const ping = document.getElementById("ping");
            const status = document.getElementById("status");
            const picker = document.getElementById("serial");
            let connected = false;
            let lost = false;

            function show(text, isConnected = false) {
                status.textContent = text;
                connected = isConnected;
                if (!connected) {
                    ping.textContent = "-";
                }
            }

            // The wasm side reports its state on the console, follow it.
            function follow(line) {
                const value = line.match(/^potato\/ping = (.*)$/);
                const attempt = line.match(/^No device yet, retrying \(attempt (\d+)\)/);
                if (value && connected) {
                    ping.textContent = value[1];
                } else if (attempt) {
                    show(`${lost ? "reconnecting" : "connecting"} (attempt ${attempt[1]})`);
                } else if (line === "Connected" || line === "Reconnected") {
                    lost = false;
                    show("connected", true);
                } else if (line.startsWith("Connection lost") || line.startsWith("Session closed")) {
                    lost = true;
                    show("reconnecting");
                } else if (line.startsWith("Serial port closed")) {
                    show("serial port closed");
                    picker.hidden = false;
                }
            }

            for (const level of ["info", "warn", "error"]) {
                const original = console[level].bind(console);
                console[level] = (...args) => {
                    original(...args);
                    const line = args.join(" ");
                    follow(line);
                    log.textContent += `${new Date().toLocaleTimeString()} ${line}\n`;
                    log.scrollTop = log.scrollHeight;
                };
            }

            if (!("serial" in navigator)) {
                console.error("Web Serial is not available, use Chrome or Edge");
            }

            async function open(port) {
                // Still open when picked again after the link gave up on it.
                if (!port.readable) {
                    await port.open({ baudRate: 115200 });
                }
                set_serial_port(port);
                picker.hidden = true;
                show("connecting");
                console.info("Connected to serial port, looking for the device...");
            }

            picker.onclick = async () => {
                await open(await navigator.serial.requestPort());
            };

            // A board reset drops the port, start over once it is back.
            navigator.serial?.addEventListener("connect", () => location.reload());
            navigator.serial?.getPorts().then(([port]) => port && open(port));

            document.getElementById("set").onclick = () => {
                set_base_ping(Number(document.getElementById("base").value));
            };

            init();
        </script>
    </body>
</html>
